<!doctype html><html><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><meta name="viewport" content="width=device-width,initial-scale=1"><title>Active Cell Add-in</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script defer="defer" src="polyfill.js"></script><script defer="defer" src="taskpane.js"></script></head><body style="padding:15px;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif"><h3 style="margin-top:0">Destination Setting</h3><label for="targetCellInput" style="display:block;margin-bottom:5px;font-weight:700">Target Cell:</label> <input id="targetCellInput" value="A1" placeholder="Ej: A1 o Datos!A1" style="width:100%;padding:8px;box-sizing:border-box;margin-bottom:12px;border:1px solid #ccc;border-radius:4px"/><div style="margin-bottom:15px;display:flex;align-items:center;gap:8px"><input type="checkbox" id="includeSheetName" style="cursor:pointer"/> <label for="includeSheetName" style="cursor:pointer;font-size:13px">Include sheet name (ej: <i>Sheet1!D4</i> vs <i>D4</i>)</label></div><button id="saveCellBtn" style="width:100%;padding:10px;background-color:#0f7b41;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:700">Save Settings</button><p id="statusMessage" style="color:#0f7b41;font-size:13px;margin-top:10px;font-weight:700"></p></body></html>
