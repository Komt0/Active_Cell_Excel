<!doctype html><html><head><meta charset="UTF-8"/><meta http-equiv="X-UA-Compatible" content="IE=Edge"/><meta name="viewport" content="width=device-width,initial-scale=1"><title>Active Cell Add-in</title><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script defer="defer" src="polyfill.js"></script><script defer="defer" src="taskpane.js"></script></head><body style="padding:15px;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#f8f9fa"><div style="margin-bottom:15px"><button id="toggleTrackingBtn" style="width:100%;padding:10px;background-color:#0f7b41;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:700;font-size:14px">Pause Tracking</button></div><div style="background-color:#fff;padding:12px;border:1px solid #e0e0e0;border-radius:6px;margin-bottom:15px;box-shadow:0 1px 3px rgba(0,0,0,.05)"><span style="font-size:11px;color:#666;font-weight:700;text-transform:uppercase">Last Registered</span><div id="lastLoggedValue" style="font-size:16px;font-weight:700;color:#0f7b41;margin-top:2px">-</div><div id="lastLoggedTime" style="font-size:11px;color:#888;margin-top:2px">No activity yet</div></div><div style="background-color:#fff;padding:12px;border:1px solid #e0e0e0;border-radius:6px;margin-bottom:15px"><h4 style="margin-top:0;margin-bottom:10px">Destination Setting</h4><label for="sheetSelect" style="display:block;margin-bottom:4px;font-size:12px;font-weight:700">Target Sheet:</label> <select id="sheetSelect" style="width:100%;padding:6px;margin-bottom:10px;border:1px solid #ccc;border-radius:4px;background-color:#fff"><option value="">Loading sheets...</option></select> <label for="targetCellInput" style="display:block;margin-bottom:4px;font-size:12px;font-weight:700">Target Cell:</label> <input id="targetCellInput" value="V1436" style="width:100%;padding:6px;box-sizing:border-box;margin-bottom:10px;border:1px solid #ccc;border-radius:4px"/> <button id="goToTargetBtn" style="width:100%;padding:6px;background-color:#107c411a;color:#0f7b41;border:1px solid #0f7b41;border-radius:4px;cursor:pointer;font-size:12px;font-weight:700;margin-bottom:10px">Go to Target Cell</button><div style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="includeSheetName" style="cursor:pointer"/> <label for="includeSheetName" style="cursor:pointer;font-size:12px">Include sheet name</label></div></div><div style="background-color:#fff;padding:12px;border:1px solid #e0e0e0;border-radius:6px;margin-bottom:15px"><label style="display:block;margin-bottom:6px;font-size:12px;font-weight:700">Data to Export:</label> <select id="captureModeSelect" style="width:100%;padding:6px;margin-bottom:12px;border:1px solid #ccc;border-radius:4px;background-color:#fff"><option value="address">Cell Address</option><option value="value">Cell Value</option><option value="formula">Cell Formula</option><option value="both">Value / Address</option></select><div style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="autoCopyClipboard" style="cursor:pointer"/> <label for="autoCopyClipboard" style="cursor:pointer;font-size:12px">Auto-copy to Clipboard</label></div></div><button id="saveCellBtn" style="width:100%;padding:10px;background-color:#0f7b41;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:700">Save Settings</button><p id="statusMessage" style="color:#0f7b41;font-size:12px;margin-top:10px;font-weight:700;text-align:center"></p></body></html>
